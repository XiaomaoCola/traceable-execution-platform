[tool.poetry]
name = "traceable-execution-platform"
version = "0.1.0"
description = "A traceable and recoverable controlled execution backend platform"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
redis = "^5.0.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = ">=1.7.4"
python-multipart = "^0.0.6"
pydantic = {extras = ["email"], version = "^2.5.3"}
pydantic-settings = "^2.1.0"
aiofiles = "^23.2.1"
asyncpg = "^0.31.0"
psycopg = {extras = ["binary"], version = "^3.3.2"}
httpx = "^0.27"
boto3 = "^1.42.61"
langchain = "^0.3"
langchain-ollama = "^0.2"
langchain-core = "^0.3"
pgvector = "^0.3"
pypdf = "^4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
black = "^24.1.1"
ruff = "^0.1.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]          # 让 pytest 能找到 backend.app.* 模块
testpaths = ["tests"]       # 只在 tests/ 目录下找测试文件
asyncio_mode = "auto"       # pytest-asyncio：async 测试函数自动识别

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
